<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GH Worker App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, scrolling main, fixed active-task bar and tab bar. Big touch targets, state shown by pills and colour bands. */
:root{
  --bg:#edf1ec; --surface:#ffffff; --surface2:#f5f8f4; --ink:#15221a; --muted:#566a5d; --line:#d3dcd2;
  --accent:#1c6b43; --accent-ink:#ffffff; --accent-soft:#dcefe3;
  --sun:#b87a00; --sun-soft:#fbefcf; --bad:#b3261e; --bad-soft:#fbe1de; --ok:#1c6b43; --scrim:rgba(10,20,14,.5);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#18221c; --surface2:#1f2b24; --ink:#e7efe9; --muted:#9db0a3; --line:#2c3b32;
  --accent:#4fc487; --accent-ink:#06210f; --accent-soft:#1d3a2a;
  --sun:#f0b83a; --sun-soft:#3a2f10; --bad:#ff8a80; --bad-soft:#40201d; --ok:#4fc487; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#18221c; --surface2:#1f2b24; --ink:#e7efe9; --muted:#9db0a3; --line:#2c3b32;
  --accent:#4fc487; --accent-ink:#06210f; --accent-soft:#1d3a2a;
  --sun:#f0b83a; --sun-soft:#3a2f10; --bad:#ff8a80; --bad-soft:#40201d; --ok:#4fc487; --scrim:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--sun);display:block}
.pill.on i{background:var(--ok)} .pill.off i{background:var(--bad)}
main{flex:1;padding:16px 16px 190px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;line-height:1.1} h2{font-size:18px} h3{font-size:16px}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>.row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;min-height:56px;min-width:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
button.item:active{background:var(--surface2)}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sun{background:var(--sun);color:#1b1300;border-color:var(--sun)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>.btn{flex:1;min-width:120px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--accent-soft);color:var(--accent)}
.tag.sun{background:var(--sun-soft);color:var(--sun)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.mut{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sev1[aria-pressed=true]{background:var(--accent)} .chip.sev3[aria-pressed=true],.chip.sev2[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#1b1300}
.chip.sev4[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
/* active task */
.task{border-radius:16px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden}
.task .band{height:6px;background:var(--sun)} .task.paused .band{background:var(--muted)}
.task .in{padding:14px;display:flex;flex-direction:column;gap:12px}
.timer{font-family:var(--f-mono);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bedid{font-family:var(--f-mono);font-weight:600;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:14px;white-space:nowrap}
/* bay map */
.bays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bay{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;min-height:64px}
.bay[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.bay b{font-family:var(--f-mono);font-size:15px;display:block}.bay span{font-size:12px;color:var(--muted)}
.bedgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bedbtn{min-height:60px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-family:var(--f-mono);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bedbtn small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}
.bedbtn.full{border-color:var(--accent);background:var(--accent-soft)}
/* nav + bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line)}
.dock-in{max-width:560px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sun-soft);border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
.sbar .timer{font-size:22px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{min-height:58px;border:0;background:none;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button[aria-current=page]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:90%;text-align:center}
.login{max-width:420px;margin:0 auto;padding:32px 16px;display:flex;flex-direction:column;gap:18px}
.login h1{font-size:34px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="shell">
  <header class="top" id="top"></header>
  <main id="app"></main>
</div>
<div class="dock" id="dock" hidden><div class="dock-in"><div id="sbar"></div>
  <nav class="tabs" id="tabs"></nav></div></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

ype": "Hanging Gutter Line 1"}, {"id": "GH-4-G02", "bay": "GH-4", "n": 2, "len": 288, "type": "Hanging Gutter Line 2"}, {"id": "GH-4-G03", "bay": "GH-4", "n": 3, "len": 288, "type": "Hanging Gutter Line 3"}, {"id": "GH-4-G04", "bay": "GH-4", "n": 4, "len": 288, "type": "Hanging Gutter Line 4"}, {"id": "GH-4-G05", "bay": "GH-4", "n": 5, "len": 288, "type": "Hanging Gutter Line 5"}], "bays": [{"id": "GH-1", "name": "Greenhouse Bay 1", "zone": "Cold Climate Zone", "type": "Heated In-Ground Soil Row 1", "count": 5}, {"id": "GH-2", "name": "Greenhouse Bay 2", "zone": "Temperate Commercial Canopy", "type": "Rolling Aluminum Bench 1", "count": 8}, {"id": "GH-3", "name": "Greenhouse Bay 3", "zone": "Indigenous Specialty Canopy", "type": "Rolling Aluminum Bench 1", "count": 8}, {"id": "GH-4", "name": "Greenhouse Bay 4", "zone": "Tropical High-Wire House", "type": "Hanging Gutter Line 1", "count": 5}], "acts": [{"id": "ACT-001", "name": "Pull Plastic & Drip", "group": "Bed Preparation", "phase": "Pre-Planting", "count": false, "unit": null, "avail": false, "desc": "Seed row: activity already assigned in FIELD_LIVE_SESSION. Review and complete."}, {"id": "ACT-002", "name": "Substrate Preparation", "group": "Propagation & Nursery", "phase": "Propagation", "count": false, "unit": null, "avail": false, "desc": "Mix organic coir, peat and perlite and load into mechanical flat-fillers to prepare standard 1020 trays (Header House)."}, {"id": "ACT-003", "name": "Precision Mechanical Seeding", "group": "Propagation & Nursery", "phase": "Propagation", "count": true, "unit": "tray", "avail": false, "desc": "Pneumatic seeders place seed into 128-cell trays (brassicas, alliums, leafy greens) or 72-cell deep plug trays (vertical nightshades)."}, {"id": "ACT-004", "name": "Germination Chamber Loading", "group": "Propagation & Nursery", "phase": "Propagation", "count": true, "unit": "tray", "avail": false, "desc": "Move newly seeded trays into dark, high-humidity, heated germination racks."}, {"id": "ACT-005", "name": "Tray Consolidation", "group": "Propagation & Nursery", "phase": "Propagation", "count": true, "unit": "tray", "avail": false, "desc": "Walk 4-tier mobile racks under 18-hour LED toplights; remove non-viable sprouts and thin to one seedling per cell."}, {"id": "ACT-006", "name": "Hardening-Off Staging", "group": "Propagation & Nursery", "phase": "Propagation", "count": true, "unit": "tray", "avail": false, "desc": "Roll mobile racks to the transitional cooling zone near the main bay doors to thicken stems before transplant day."}, {"id": "ACT-007", "name": "Pre-Plant Flush & Sanitization", "group": "Pre-Planting & Planting", "phase": "Pre-Planting", "count": true, "unit": "bed", "avail": true, "desc": "Power-wash aluminum bench meshes or flush hanging gutter channels with organic peroxide solution immediately before loading a new wave."}, {"id": "ACT-008", "name": "Direct In-Ground Sowing (Bay 1)", "group": "Pre-Planting & Planting", "phase": "Planting", "count": true, "unit": "ft", "avail": true, "desc": "Walk-behind precision seeder down the 288 ft lines (GH-1-R03 to GH-1-R05) to direct-sow Carrots, Beets and Turnips."}, {"id": "ACT-009", "name": "Rolling Bench Plug Planting (Bays 2 & 3)", "group": "Pre-Planting & Planting", "phase": "Planting", "count": true, "unit": "tray", "avail": true, "desc": "Load carts with 128-cell plugs, push down the shifted 2.5 ft aisles and hand-press plugs into pre-punched bench media. Requires hardened-off plugs (ACT-006)."}, {"id": "ACT-010", "name": "High-Wire Gutter Block Dropping (Bay 4)", "group": "Pre-Planting & Planting", "phase": "Planting", "count": true, "unit": "plant", "avail": true, "desc": "Place mature 72-cell nightshade root blocks onto coir/rockwool slabs in gutters GH-4-G02 to GH-4-G05. Requires hardened-off plugs (ACT-006)."}, {"id": "ACT-011", "name": "Irrigation Stake Placement", "group": "Pre-Planting & Planting", "phase": "Planting", "count": true, "unit": "plant", "avail": false, " edatory insects (lacewings, phytoseiid mites) to control thrips and aphids."}, {"id": "ACT-019", "name": "Sticky Card Auditing", "group": "IPM & Calibration", "phase": "IPM & Calibration", "count": true, "unit": "card", "avail": false, "desc": "Check and change yellow and blue sticky cards at 30 ft intervals across all 4 bays; log pest pressure on farm tablets."}, {"id": "ACT-020", "name": "Dosing Computer Validation", "group": "IPM & Calibration", "phase": "IPM & Calibration", "count": true, "unit": "sample", "avail": false, "desc": "Extract water samples from gutter drainage ports and run manual EC and pH tests to confirm fertigation injection loops are calibrated."}, {"id": "ACT-021", "name": "Drip Line Purging", "group": "IPM & Calibration", "phase": "IPM & Calibration", "count": false, "unit": null, "avail": false, "desc": "Open terminal flush valves at the southern ends of the 288 ft rows to purge organic films, calcium scale and sediment."}, {"id": "ACT-022", "name": "Leafy Green Clear-Cutting (Bays 2 & 3)", "group": "Harvest & Post-Harvest", "phase": "Harvest", "count": true, "unit": "tote", "avail": true, "desc": "Clean-cut whole benches of Mchicha, Sukuma Wiki, Lettuce and Spinach at the crown line into sanitizable field totes."}, {"id": "ACT-023", "name": "High-Wire Hand-Picking (Bay 4)", "group": "Harvest & Post-Harvest", "phase": "Harvest", "count": true, "unit": "crate", "avail": true, "desc": "Hand-harvest mature Tomatoes, Chilies, Habaneros and Eggplants from gutter aisles into cradled transport crates."}, {"id": "ACT-024", "name": "Root Crop Extraction (Bay 1)", "group": "Harvest & Post-Harvest", "phase": "Harvest", "count": true, "unit": "tote", "avail": true, "desc": "Hand-pull or fork-lift Carrots, Beets and Turnips from the heated soil beds."}, {"id": "ACT-025", "name": "Field Heat Removal (Cold Chain Staging)", "group": "Harvest & Post-Harvest", "phase": "Post-Harvest", "count": true, "unit": "tote", "avail": true, "desc": "Wheel loaded harvest const STAGE={PRE_PLANTING:'Planned',GROWING:'Growing',HARVEST_READY:'Ready to harvest',HARVEST_COMPLETE:'Harvest done'};
const bayBy=id=>D.bays.find(b=>b.id===id);
const KEY='ghw.v1';
let S={user:null,sessions:[],cohorts:{},log:[],scouts:[],issues:[],seeded:{},token:null,queue:[],ref:null,lastUser:null};
let ui={tab:'today',bay:'GH-1',bed:null,q:'',scout:null,issue:null,online:navigator.onLine};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
if(S.ref)Object.assign(D,S.ref);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const bedType=b=>/Soil/.test(b.type)?'Soil row':/Bench/.test(b.type)?'Rolling bench':'Gutter line';

// Clear any example data saved by earlier versions of this app
S.sessions=S.sessions.filter(s=>!s.demo);
Object.keys(S.cohorts).forEach(k=>{if(S.cohorts[k].demo)delete S.cohorts[k]});
S.seeded={};S.cohortsSeeded=false;

/* ---------- time ---------- */
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const pausedMs=(s,now)=>(s.pauses||[]).reduce((a,p)=>a+((p.resumedAt||now)-p.at),0);
const elapsed=(s,now=Date.now())=>(s.endAt||now)-s.startAt-pausedMs(s,now);
const hhmm=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const sameDay=t=>new Date(t).toDateString()===new Date().toDateString();
const live=()=>S.sessions.find(s=>s.workerId===S.user?.id&&(s.status==='ACTIVE'||s.status==='PAUSED'));

/* ---------- ui helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function openSheet(html){const s=$('#sheet');s.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';s.hidden=false}

 today:'<svg viewBox="0 0 24 24"><path d="M4 12l8-8 8 8M6 10v10h12V10"/></svg>',
 beds:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>',
 scout:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
 issue:'<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>'};

/* ---------- views ---------- */
function loginView(){

  <form id="lf" class="sec" autocomplete="off">
   <div class="field"><label for="wid">Worker ID</label><input id="wid" type="text" autocapitalize="none" autocorrect="off" value="${esc(ui.wid||'')}" placeholder="e.g. lisa"></div>
   <div class="field"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="4-digit PIN"></div>

   <button class="btn pri" type="submit">Sign in</button></form>
  </div>`;
}
function todayView(){
  const u=S.user, mine=S.sessions.filter(s=>s.workerId===u.id);
  const cur=live(), assigned=mine.filter(s=>s.status==='ASSIGNED'), done=mine.filter(s=>s.status==='DONE'&&sameDay(s.endAt));
  const hr=new Date().getHours(), g=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  let h=`<div><div class="eyebrow">${new Date().toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'})}</div><h1>${g}, ${esc(u.name.split(' ')[0])}</h1></div>`;
  if(cur)h+=`<section class="sec"><div class="eyebrow">In progress</div>${taskCard(cur)}</section>`;
  h+=`<section class="sec"><div class="row"><h2>Assigned to you</h2><span class="muted" style="font-size:13px">${assigned.length} waiting</span></div>`;
  h+=assigned.length?`<div class="list">${assigned.map(s=>{const a=actBy(s.actId),b=bedBy(s.bedId);return `<button class="item" data-a="startAssigned" data-id="${s.id}"><div class="grow"><div class="t">${esc(a.name)}</div><div class="s"><span class="bedid">${esc(s.bedId)}</span> ${esc(a.phase)}${b?' · '+bedType(b):''}</div></div><span class="tag">Start</span></button>`}).join('')}</div>`:`<div class="empty">Nothing assigned right now. Pick a bed to start a task.</div>`;
  h+=`<button class="btn pri" data-a="newTask" ${cur?'disabled':''}>Start a task on a bed</button>${cur?'<div class="muted" style="font-size:13px">Finish or pause-and-complete the task in progress first.</div>':''}</section>`;
  if(done.length)h+=`<section class="sec"><h2>Done today</h2><div class="list">${done.map(s=>{const a=actBy(s.actId);return `<div class="item"><div class="grow"><div class="t">${esc(a.name)}</div><div class="s"><span class="bedid">${esc(s.bedId)}</span> ${fmt(elapsed(s)).slice(0,5)} h:m${s.qtyText?' · '+esc(s.qtyText):''}</div></div><span class="tag mut">${hhmm(s.endAt)}</span></div>`}).join('')}</div></section>`;
  return h;
}
function taskCard(s){
  const a=actBy(s.actId),b=bedBy(s.bedId),paused=s.status==='PAUSED',coh=S.cohorts[s.bedId];
  const crop=coh?{name:coh.crop}:null;
  return `<div class="task ${paused?'paused':''}"><div class="band"></div><div class="in">
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="bedid">${esc(s.bedId)}</span><span class="tag ${paused?'mut':'sun'}">${paused?'Paused · '+esc(s.pauses[s.pauses.length-1].reason):'Running'}</span>${crop?`<span class="tag">${esc(crop.name)}</span>`:''}</div>
   <div><h2>${esc(a.name)}</h2>${a.desc?`<div class="muted" style="font-size:13px;margin-top:4px">${esc(a.desc)}</div>`:''}</div>
   <div class="timer" data-timer="${s.id}">${fmt(elapsed(s))}</div>
   <div class="muted" style="font-size:13px">Started ${hhmm(s.startAt)} · paused ${Math.round(pausedMs(s,Date.now())/60000)} min</div>
   <div class="btns">${paused?`<button class="btn sun" data-a="resume">Resume</button>`:`<button class="btn" data-a="pause">Pause</button>`}<button class="btn pri" data-a="complete">Complete</button></div></div></div>`;
}
function bedsView(){
  const bay=bayBy(ui.bay), beds=D.beds.filter(b=>b.bay===ui.bay);
  let h=`<div><div class="eyebrow">Find a bed</div><h1>Beds</h1></div>
  <form id="qf" class="sec"><div class="field"><label for="qr">Scan or type a bed code</label>
   <div style="display:flex;gap:8px"><input id="qr" type="text" autocapitalize="characters" autocorrect="off" placeholder="GH-2-B03" value="${esc(ui.q)}"><button class="btn pri" type="submit" style="min-width:84px">Go</button></div></div>
   <div class="muted" style="font-size:13px">Camera scanning is not available in this app. Type the code printed on the bed tag.</div></form>
  <section class="sec"><div class="lbl">Bays</div><div class="bays">${D.bays.map(b=>`<button class="bay" data-a="bay" data-id="${b.id}" aria-pressed="${b.id===ui.bay}"><b>${b.id}</b><span>${esc(b.zone)} · ${b.count} beds</span></button>`).join('')}</div></section>
  <section class="sec"><div class="row"><h2>${esc(bay.name)}</h2><span class="muted" style="font-size:13px">${esc(bay.type)}</span></div>
   <div class="bedgrid">${beds.map(b=>{const c=S.cohorts[b.id];return `<button class="bedbtn ${c?'full':''}" data-a="openBed" data-id="${b.id}">${b.id.split('-').slice(2).join('')}<small>${c?esc(c.crop.split(' ')[0]):'Empty'}</small></button>`}).join('')}</div></section>`;

  const b=bedBy(ui.bed);if(!b){ui.tab='beds';return bedsView()}
  const c=S.cohorts[b.id],cur=live();
  const hist=S.log.filter(l=>l.bedId===b.id).slice(-6).reverse(), sc=S.scouts.filter(x=>x.bedId===b.id).slice(-3).reverse();

  return `<button class="btn ghost sm" data-a="tab" data-id="beds" style="align-self:flex-start">← Beds</button>
  <div><div class="eyebrow">${esc(bayBy(b.bay).name)} · ${esc(bayBy(b.bay).zone)}</div><h1 class="mono" style="font-family:var(--f-mono)">${b.id}</h1></div>
  <div class="card"><dl class="kv"><dt>Type</dt><dd>${bedType(b)}</dd><dt>Length</dt><dd>${b.len} ft</dd><dt>Crop</dt><dd>${c?esc(c.crop)+' <span class="tag '+(c.stage==='HARVEST_READY'?'sun':'')+'">'+(STAGE[c.stage]||c.stage)+'</span>':'<span class="tag mut">Empty</span>'}</dd>${c?`<dt>Cohort</dt><dd class="mono">${esc(c.id)}</dd><dt>${c.planted?'Planted':'Planned'}</dt><dd>${esc(c.dob)}${c.planted?' · day '+days:''}</dd>${c.stage==='PRE_PLANTING'?`<dt>Bed</dt><dd>${c.ver?'<span class="tag">Verified ready</span>':'<span class="tag mut">Waiting for manager check</span>'}</dd>`:''}`:''}</dl>
  </div>
  <div class="btns"><button class="btn pri" data-a="startHere" data-id="${b.id}" ${cur?'disabled':''}>Start task here</button><button class="btn" data-a="scoutHere" data-id="${b.id}">Scout</button></div>
  ${cur?'<div class="muted" style="font-size:13px">A task is already in progress.</div>':''}
  <section class="sec"><h2>Recent work</h2>${hist.length?`<div class="list">${hist.map(l=>`<div class="item"><div class="grow"><div class="t">${esc(l.act)}</div><div class="s">${esc(l.worker)} · ${new Date(l.end).toLocaleDateString()} · ${l.min} min${l.qty?' · '+esc(l.qty):''}</div></div></div>`).join('')}</div>`:'<div class="empty">No work logged on this bed yet.</div>'}</section>
  ${sc.length?`<section class="sec"><h2>Scout findings</h2><div class="list">${sc.map(x=>`<div class="item"><div class="grow"><div class="t">${esc(x.domains.join(', '))}</div><div class="s">${SEV[x.sev-1]} · ${new Date(x.at).toLocaleDateString()}${x.note?' · '+esc(x.note):''}</div></div><span class="tag ${x.sev>=3?'bad':'sun'}">${SEV[x.sev-1]}</span></div>`).join('')}</div></section>`:''}`;

function bedSelect(id,val,opt){return `<select id="${id}">${opt?'<option value="">No specific bed</option>':'<option value="">Choose a bed</option>'}${D.bays.map(y=>`<optgroup label="${esc(y.name)}">${D.beds.filter(b=>b.bay===y.id).map(b=>`<option value="${b.id}" ${b.id===val?'selected':''}>${b.id}</option>`).join('')}</optgroup>`).join('')}</select>`}
function scoutView(){
  const d=ui.scout=ui.scout||{bed:'',domains:[],sev:0,note:'',photo:null};
  return `<div><div class="eyebrow">Report what you see</div><h1>Scout finding</h1></div>
  <div class="field"><label for="sc-bed">Bed</label>${bedSelect('sc-bed',d.bed)}</div>
  <div class="field"><span class="lbl">What kind of problem (pick any)</span><div class="chips">${DOMAINS.map(x=>`<button class="chip" data-a="dom" data-id="${esc(x)}" aria-pressed="${d.domains.includes(x)}">${esc(x)}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">Severity</span><div class="chips">${SEV.map((x,i)=>`<button class="chip sev${i+1}" data-a="sev" data-id="${i+1}" aria-pressed="${d.sev===i+1}">${x}</button>`).join('')}</div></div>
  <div class="field"><label for="sc-note">Notes</label><textarea id="sc-note" placeholder="Where on the bed, how many plants, what it looks like">${esc(d.note)}</textarea></div>
  <div class="field"><label for="sc-photo">Photo</label><input id="sc-photo" type="file" accept="image/*" capture="environment">${d.photo?`<img class="thumb" src="${d.photo}" alt="Attached photo">`:''}</div>
  <button class="btn pri" data-a="submitScout">Save finding</button>
  ${recent(S.scouts,x=>`${x.bedId} · ${x.domains.join(', ')}`,x=>`${SEV[x.sev-1]} · ${hhmm(x.at)}`)}`;

function issueView(){
  const d=ui.issue=ui.issue||{cat:'',bed:'',note:'',ask:true};
  return `<div><div class="eyebrow">Something wrong?</div><h1>Report an issue</h1></div>
  <div class="field"><span class="lbl">Category</span><div class="chips">${ISSUE_CATS.map(x=>`<button class="chip" data-a="cat" data-id="${esc(x)}" aria-pressed="${d.cat===x}">${esc(x)}</button>`).join('')}</div></div>
  <div class="field"><label for="is-bed">Bed (optional)</label>${bedSelect('is-bed',d.bed,true)}</div>
  <div class="field"><label for="is-note">What happened</label><textarea id="is-note" placeholder="Describe the problem and anything that is unsafe">${esc(d.note)}</textarea></div>
  <button class="chip" data-a="ask" aria-pressed="${d.ask}" style="align-self:flex-start">Ask a manager to step in</button>
  <button class="btn ${d.cat==='Safety concern'?'bad':'pri'}" data-a="submitIssue">Send report</button>
  ${recent(S.issues,x=>`${x.cat}${x.bedId?' · '+x.bedId:''}`,x=>`${x.ask?'Manager asked':'Logged'} · ${hhmm(x.at)}`)}`;
}
function recent(arr,t,s){const r=arr.filter(x=>x.workerId===S.user.id).slice(-3).reverse();if(!r.length)return '';
  return `<section class="sec"><h2>Your recent reports</h2><div class="list">${r.map(x=>`<div class="item"><div class="grow"><div class="t">${esc(t(x))}</div><div class="s">${esc(s(x))}</div></div></div>`).join('')}</div></section>`}

/* ---------- render ---------- */
function connPill(){
  const q=S.user?S.queue.filter(x=>x.u===S.user.id).length:0;
  if(!ui.online)return `<button class="pill off" data-a="conn"><i></i>Offline${q?' · '+q+' to sync':''}</button>`;
  if(q)return `<button class="pill" data-a="conn"><i></i>${q} to sync</button>`;
  return `<button class="pill on" data-a="conn"><i></i>Live</button>`;
}
function paintTop(){const logged=!!S.user;$('#top').innerHTML=logged?`<div class="brand">GH Worker App<small>${esc(S.user.name)} · ${esc(S.user.role)}</small></div>${connPill()}<button class="pill" data-a="logout">Sign out</button>`:`<div class="brand">GH Worker App</div>${connPill()}`;}
function render(){
  const logged=!!S.user;
  paintTop();
  $('#dock').hidden=!logged;
  if(!logged){$('#app').innerHTML=loginView();return}
  const v=ui.tab==='today'?todayView():ui.tab==='beds'?(ui.bed?bedView():bedsView()):ui.tab==='scout'?scoutView():issueView();
  $('#app').innerHTML=v;
  const cur=live();
  $('#sbar').innerHTML=cur&&ui.tab!=='today'?`<button class="sbar" data-a="tab" data-id="today"><div style="flex:1;min-width:0"><div class="eyebrow">${cur.status==='PAUSED'?'Paused':'Running'} · ${esc(cur.bedId)}</div><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(actBy(cur.actId).name)}</div></div><div class="timer" data-timer="${cur.id}">${fmt(elapsed(cur))}</div></button>`:'';
  $('#tabs').innerHTML=[['today','Today'],['beds','Beds'],['scout','Scout'],['issue','Report']].map(([k,l])=>`<button data-a="tab" data-id="${k}" ${ui.tab===k?'aria-current="page"':''}>${ICON[k==='issue'?'issue':k]}${l}</button>`).join('');
}
setInterval(()=>{const now=Date.now();document.querySelectorAll('[data-timer]').forEach(el=>{const s=S.sessions.find(x=>x.id===el.dataset.timer);if(s)el.textContent=fmt(elapsed(s,now))})},1000);
addEventListener('online',()=>{ui.online=true;paintTop();pull()});addEventListener('offline',()=>{ui.online=false;paintTop()});

/* ---------- task flow ---------- */
function activitySheet(bedId){
  sh={bedId,q:''};
  drawActs();
}
function drawActs(){
  const q=(sh.q||'').toLowerCase(), list=D.acts.filter(a=>!q||a.name.toLowerCase().includes(q)||a.phase.toLowerCase().includes(q));
  const keep=document.getElementById('aq');const had=keep&&document.activeElement===keep;
  openSheet(`<div class="hd"><div><div class="eyebrow">Start a task on</div><h2 class="mono" style="font-family:var(--f-mono)">${sh.bedId}</h2></div><button class="btn ghost sm" data-a="close">Cancel</button></div>
   <input id="aq" type="text" placeholder="Search activities" value="${esc(sh.q||'')}">
   ${phases().map(p=>{const xs=list.filter(a=>a.phase===p);return xs.length?`<div class="sec"><div class="eyebrow">${p}</div><div class="list">${xs.map(a=>`<button class="item" data-a="pickAct" data-id="${a.id}"><div class="grow"><div class="t">${esc(a.name)}</div><div class="s">${esc(a.group)}</div></div></button>`).join('')}</div></div>`:''}).join('')||'<div class="empty">No matching activity.</div>'}`);
  if(had){const e=document.getElementById('aq');e.focus();e.setSelectionRange(e.value.length,e.value.length)}
}
function begin(s){activate(s)}
function activate(s){
  s.status='ACTIVE';s.startAt=Date.now();s.pauses=[];s.workerId=S.user.id;
  if(!S.sessions.includes(s))S.sessions.push(s);
  enqueue('wStart',{sessionId:s.id,bedId:s.bedId,actName:actBy(s.actId).name,startAt:s.startAt});
  closeSheet();ui.tab='today';ui.bed=null;render();toast('Task started');
}
function completeSheet(){
  const s=live(),a=actBy(s.actId);
  const tote=a.phase==='Harvest';
  sh={sid:s.id,tote,totes:[],qty:'',flag:false,note:''};
  drawComplete();
}
function drawComplete(){
  const s=S.sessions.find(x=>x.id===sh.sid),a=actBy(s.actId);
  const total=sh.totes.reduce((t,x)=>t+x.lb,0), keepId=document.activeElement&&document.activeElement.id;
  let body='';
  if(sh.tote){
    body=`<div class="sec"><div class="lbl">Tote weigh-in</div>
     <div style="display:flex;gap:8px"><input id="tw" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Weight (lb)"><button class="btn pri" data-a="toteAdd" style="min-width:90px">Add tote</button></div>
     ${sh.totes.length?`<div class="list">${sh.totes.map((t,i)=>`<div class="item"><div class="grow"><div class="t mono">Tote ${i+1} · ${t.lb.toFixed(1)} lb</div></div><button class="btn sm" data-a="toteDel" data-id="${i}">Remove</button></div>`).join('')}</div>
     <div class="card" style="flex-direction:row;justify-content:space-between;align-items:baseline"><span class="muted">${sh.totes.length} tote${sh.totes.length>1?'s':''}</span><b class="mono" style="font-size:22px">${total.toFixed(1)} lb</b></div>`:'<div class="empty">Weigh each tote and add it. Totals roll up here.</div>'}</div>`;
  }else if(a.count){
    body=`<div class="field"><label for="cq2">How many ${esc(a.unit||'units')}?</label><input id="cq2" type="number" inputmode="decimal" min="0" value="${esc(sh.qty)}"></div>`;
  }
  openSheet(`<div class="hd"><div><div class="eyebrow">Complete · ${esc(s.bedId)}</div><h2>${esc(a.name)}</h2></div><button class="btn ghost sm" data-a="close">Back</button></div>
   <div class="muted">Time worked <b class="mono">${fmt(elapsed(s))}</b></div>${body}
   <button class="chip" data-a="flag" aria-pressed="${sh.flag}" style="align-self:flex-start">Needs follow-up</button>
   <div class="field"><label for="cn">Notes (optional)</label><textarea id="cn">${esc(sh.note)}</textarea></div>
   <button class="btn pri" data-a="finish">Finish task</button>`);
  if(keepId){const e=document.getElementById(keepId);if(e&&keepId!=='cn'){e.focus()}}
}
function finish(){
  const s=S.sessions.find(x=>x.id===sh.sid),a=actBy(s.actId);
  let qty='',unit=a.unit||'',n=null;
  if(sh.tote){if(!sh.totes.length){toast('Add at least one tote');return}
    n=sh.totes.reduce((t,x)=>t+x.lb,0);qty=sh.totes.length+' totes · '+n.toFixed(1)+' lb';s.totes=sh.totes}
  else if(a.count){const v=parseFloat(sh.qty);if(!(v>=0)||sh.qty===''){toast('Enter a quantity');return}n=v;qty=v+' '+unit}
  s.status='DONE';s.endAt=Date.now();s.qty=n;s.unit=sh.tote?'lb':unit;s.qtyText=qty;s.flag=sh.flag;s.note=sh.note;
  S.log.push({id:'LOG-'+Date.now(),sid:s.id,bedId:s.bedId,act:a.name,worker:S.user.name,end:s.endAt,min:Math.round(elapsed(s)/60000),qty,flag:sh.flag});
  enqueue('wComplete',{sessionId:s.id,startAt:s.startAt,endAt:s.endAt,qty:sh.tote?s.totes.length:n,unit:sh.tote?(a.unit||'tote'):unit,flag:!!sh.flag,note:sh.note||'',totes:s.totes||[]});
  closeSheet();render();toast('Task completed');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id;
  switch(a){
   case'fillw':ui.wid=id;$('#wid').value=id;$('#pin').focus();break;
   case'tab':ui.tab=id;ui.bed=null;render();scrollTo(0,0);break;
   case'bay':ui.bay=id;render();break;
   case'openBed':ui.bed=id;render();scrollTo(0,0);break;
   case'newTask':ui.tab='beds';ui.bed=null;render();toast('Pick the bed you are working on');break;
   case'startHere':activitySheet(id);break;
   case'scoutHere':ui.scout={bed:id,domains:[],sev:0,note:'',photo:null};ui.tab='scout';render();break;
   case'pickAct':{const A=actBy(id),C=S.cohorts[sh.bedId];
     if(A.phase==='Planting'&&!C){toast('Planting needs a cohort planned on this bed');break}
     if(A.phase==='Harvest'&&!(C&&C.stage==='HARVEST_READY')){toast('Harvest needs the crop verified mature by a manager');break}
     const s={id:newSid(),workerId:S.user.id,managerId:'',bedId:sh.bedId,actId:id,status:'ASSIGNED',pauses:[]};S.sessions.push(s);begin(s);break}
   case'startAssigned':{if(live()){toast('Finish the task in progress first');break}begin(S.sessions.find(x=>x.id===id));break}
   case'pause':openSheet(`<div class="hd"><h2>Why are you pausing?</h2><button class="btn ghost sm" data-a="close">Cancel</button></div><div class="list">${PAUSE.map(r=>`<button class="item" data-a="doPause" data-id="${r}"><div class="t">${r}</div></button>`).join('')}</div>`);break;
   case'doPause':{const s=live(),at=Date.now();s.status='PAUSED';s.pauses.push({at,reason:id});enqueue('wPause',{sessionId:s.id,reason:id,at});closeSheet();render();toast('Paused: '+id);break}
   case'resume':{const s=live(),p=s.pauses[s.pauses.length-1];p.resumedAt=Date.now();s.status='ACTIVE';enqueue('wResume',{sessionId:s.id,at:p.resumedAt});render();break}
   case'complete':completeSheet();break;
   case'toteAdd':{const v=parseFloat($('#tw').value);if(!(v>0)){toast('Enter the tote weight');break}sh.note=$('#cn').value;sh.totes.push({lb:v,at:Date.now()});drawComplete();$('#tw').focus();break}
   case'toteDel':sh.note=$('#cn').value;sh.totes.splice(+id,1);drawComplete();break;
   case'flag':sh.note=$('#cn').value;sh.flag=!sh.flag;if(!sh.tote)sh.qty=$('#cq2')?.value??sh.qty;drawComplete();break;
   case'finish':sh.note=$('#cn').value;if(!sh.tote&&$('#cq2'))sh.qty=$('#cq2').value;finish();break;
   case'close':closeSheet();break;
   case'dom':{const d=ui.scout,i=d.domains.indexOf(id);i<0?d.domains.push(id):d.domains.splice(i,1);render();break}
   case'sev':ui.scout.sev=+id;render();break;
   case'cat':ui.issue.cat=id;render();break;
   case'ask':ui.issue.ask=!ui.issue.ask;render();break;
   case'submitScout':{const d=ui.scout;if(!d.bed||!d.domains.length||!d.sev){toast('Choose a bed, a problem type and a severity');break}
     S.scouts.push({id:'SCT-'+Date.now(),workerId:S.user.id,bedId:d.bed,cohortId:S.cohorts[d.bed]?.id||null,domains:d.domains,sev:d.sev,note:d.note,photo:d.photo,at:Date.now()});
     {const o=S.scouts[S.scouts.length-1];enqueue('wScout',{id:o.id,bedId:o.bedId,domains:o.domains,sev:o.sev,note:o.note,photo:o.photo,at:o.at})}
     ui.scout=null;render();toast('Finding saved');break}
   case'submitIssue':{const d=ui.issue;if(!d.cat||!d.note.trim()){toast('Choose a category and describe the problem');break}
     S.issues.push({id:'ISS-'+Date.now(),workerId:S.user.id,bedId:d.bed||null,cat:d.cat,note:d.note,ask:d.ask,at:Date.now()});
     {const o=S.issues[S.issues.length-1];enqueue('wIssue',{id:o.id,bedId:o.bedId,cat:o.cat,note:o.note,ask:o.ask,at:o.at})}
     ui.issue=null;render();toast(d.ask?'Sent. A manager has been asked to step in':'Report saved');break}
   case'conn':{const q=S.queue.filter(x=>x.u===S.user?.id).length;toast(!ui.online?'Offline. '+(q?q+' change(s) will sync when you are back online':'Changes will sync when you are back online'):q?'Syncing '+q+' change(s)':'Connected to the ranch workbook');pull(true);break}
   case'logout':{if(live()){toast('Complete or finish your task before signing out');break}if(S.queue.some(x=>x.u===S.user.id)){toast('Some changes have not synced yet. Connect to the internet first.');break}api('wLogout');S.user=null;S.token=null;ui={...ui,tab:'today',bed:null,loginMsg:''};save();render();break}
  }
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='lf'){
    const id=$('#wid').value.trim().toLowerCase(),pin=$('#pin').value.trim(),er=$('#lerr'),btn=e.target.querySelector('button[type=submit]');
    if(!id||!pin){er.textContent='Enter your Worker ID and PIN.';er.hidden=false;return}
    btn.disabled=true;btn.textContent='Signing in…';er.hidden=true;
    const r=await api('workerLogin',{user:id,pin});
    if(!r.ok){er.textContent=r.code==='NET'?'Cannot reach the server. Check your connection and try again.':r.error;er.hidden=false;btn.disabled=false;btn.textContent='Sign in';return}
    if(S.lastUser&&S.lastUser!==r.user.id){const keep=new Set(S.queue.map(q=>q.p.sessionId));S.sessions=S.sessions.filter(x=>keep.has(x.id));S.cohorts={};}
    S.token=r.token;S.user=r.user;S.lastUser=r.user.id;ui.loginMsg='';ui.online=true;ui.tab='today';save();render();pull();
  }
  if(e.target.id==='qf'){
    const raw=$('#qr').value.toUpperCase().replace(/\s/g,''),m=raw.match(/^GH-?(\d)-?([RBG])-?(\d{1,2})$/);
    const id=m?`GH-${m[1]}-${m[2]}${m[3].padStart(2,'0')}`:null;
    if(id&&bedBy(id)){ui.q='';ui.bed=id;ui.bay=bedBy(id).bay;render()}
    else{ui.q=raw;toast('No bed matches "'+raw+'". Use the format GH-2-B03.')}
  }
});
document.addEventListener('input',e=>{
  const i=e.target.id;
  if(i==='aq'){sh.q=e.target.value;drawActs()}
  else if(i==='sc-note')ui.scout.note=e.target.value;
  else if(i==='is-note')ui.issue.note=e.target.value;
  else if(i==='wid')ui.wid=e.target.value;
});
document.addEventListener('change',e=>{
  const i=e.target.id;
  if(i==='sc-bed')ui.scout.bed=e.target.value;
  else if(i==='is-bed')ui.issue.bed=e.target.value;
  else if(i==='sc-photo'&&e.target.files[0]){
    const f=e.target.files[0],r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ui.scout.photo=c.toDataURL('image/jpeg',.7);render()};im.src=r.result};r.readAsDataURL(f);
  }
});
/* ---------- server link (Apps Script web app on the VPOS-GH workbook) ---------- */
async function api(action,payload={}){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,
      body:JSON.stringify(Object.assign({action,token:S.token,device:navigator.userAgent},payload))});
    const j=await r.json();if(j&&!j.ok&&j.error==='Session expired')j.code='AUTH';return j;
  }catch(e){return{ok:false,code:'NET',error:'Cannot reach the server.'}}
  finally{clearTimeout(to)}
}
function enqueue(k,p){S.queue.push({k,u:S.user.id,p,t:Date.now()});save();paintTop();flush()}
function softRender(){const a=document.activeElement;if(!$('#sheet').hidden||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))paintTop();else render()}
function expire(){S.token=null;S.user=null;ui.loginMsg='Your session expired. Sign in again to finish syncing.';save();render()}
let flushing=false;
async function flush(){
  if(flushing||!S.token||!S.user)return;flushing=true;
  try{
    for(;;){
      const i=S.queue.findIndex(q=>q.u===S.user.id);if(i<0)break;
      const q=S.queue[i],r=await api(q.k,q.p);
      if(r.ok){S.queue.splice(i,1);save();ui.online=true;continue}
      if(r.code==='NET'){ui.online=false;break}
      if(r.code==='AUTH'){expire();break}
      S.queue.splice(i,1);if(q.k==='wStart')S.sessions=S.sessions.filter(x=>x.id!==q.p.sessionId);save();toast('Not saved: '+r.error);pull();
    }
  }finally{flushing=false;if(S.user)softRender()}
}
function actIdByName(n){
  const k=String(n||'').trim().toLowerCase(),a=D.acts.find(x=>x.name.toLowerCase()===k);if(a)return a.id;
  const id='X-'+k.replace(/\W+/g,'-');D.acts.push({id,name:String(n),group:'Other',phase:'Maintenance',count:false,unit:'',avail:false,desc:''});return id;
}
function applySync(r){
  D.beds=r.beds;D.bays=r.bays;if(r.acts.length)D.acts=r.acts;
  S.ref={beds:D.beds,bays:D.bays,acts:D.acts};
  if(!D.bays.find(b=>b.id===ui.bay)&&D.bays[0])ui.bay=D.bays[0].id;
  const pend=new Set(S.queue.map(q=>q.p.sessionId).filter(Boolean)),pid=new Set(S.queue.map(q=>q.p.id).filter(Boolean));
  const fresh=r.sessions.filter(x=>!pend.has(x.id)&&x.startAt!==null||x.status==='ASSIGNED'&&!pend.has(x.id)).map(x=>({id:x.id,workerId:x.workerId,managerId:x.managerId,bedId:x.bedId,actId:actIdByName(x.actName),status:x.status,startAt:x.startAt,endAt:x.endAt,pauses:x.pauses,cropId:x.cropId||undefined,qtyText:x.qtyText}));
  S.sessions=fresh.concat(S.sessions.filter(x=>pend.has(x.id)));
  S.cohorts=r.cohorts;S.log=r.log;
  S.scouts=r.scouts.concat(S.scouts.filter(x=>pid.has(x.id)));
  S.issues=r.issues.concat(S.issues.filter(x=>pid.has(x.id)));
}
async function pull(){
  if(!S.token||!S.user)return;
  await flush();
  if(!S.user||S.queue.some(q=>q.u===S.user.id))return;
  const r=await api('wSync');
  if(r.ok){ui.online=true;applySync(r);save();softRender()}
  else if(r.code==='AUTH')expire();
  else if(r.code==='NET'){ui.online=false;paintTop()}
  else toast('Could not load the workbook: '+r.error);
}
setInterval(()=>{if(!document.hidden)pull()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

render();if(S.token&&S.user)pull();
</script>
